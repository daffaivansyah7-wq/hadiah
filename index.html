<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>for yaya ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;

            font-family: "DM Sans", Arial, sans-serif;

            background:
                radial-gradient(circle at 10% 20%,
                    rgba(255, 52, 142, .28),
                    transparent 28%),
                radial-gradient(circle at 90% 15%,
                    rgba(255, 113, 177, .18),
                    transparent 25%),
                radial-gradient(circle at 80% 90%,
                    rgba(187, 31, 130, .3),
                    transparent 32%),
                linear-gradient(135deg,
                    #16000f 0%,
                    #3c0025 45%,
                    #17000f 100%);
        }

        body::before {
            content: "";

            position: absolute;
            inset: 0;

            background-image:
                radial-gradient(circle,
                    rgba(255, 255, 255, .7) 1px,
                    transparent 1.5px);

            background-size: 70px 70px;
            opacity: .12;

            pointer-events: none;
        }

        body::after {
            content: "";

            position: absolute;

            width: 600px;
            height: 600px;

            border-radius: 50%;

            background:
                radial-gradient(circle,
                    rgba(255, 35, 132, .16),
                    transparent 68%);

            filter: blur(45px);

            pointer-events: none;

            animation: ambient 7s ease-in-out infinite alternate;
        }

        @keyframes ambient {
            from {
                transform: scale(.9);
                opacity: .65;
            }

            to {
                transform: scale(1.15);
                opacity: 1;
            }
        }

        .heart {
            position: fixed;

            z-index: 1;

            color: #ff6ca8;

            font-size: 18px;

            opacity: 0;

            pointer-events: none;

            text-shadow:
                0 0 10px rgba(255, 79, 151, .8),
                0 0 25px rgba(255, 45, 137, .45);

            animation:
                float 8s linear infinite;
        }

        .heart:nth-of-type(1) {
            font-size: 14px;
        }

        .heart:nth-of-type(2) {
            font-size: 22px;
        }

        .heart:nth-of-type(3) {
            font-size: 16px;
        }

        .heart:nth-of-type(4) {
            font-size: 25px;
        }

        .heart:nth-of-type(5) {
            font-size: 17px;
        }

        .heart:nth-of-type(6) {
            font-size: 21px;
        }

        .heart:nth-of-type(7) {
            font-size: 15px;
        }

        @keyframes float {
            0% {
                transform:
                    translateY(110vh) rotate(0deg) scale(.65);

                opacity: 0;
            }

            12% {
                opacity: .65;
            }

            50% {
                transform:
                    translateY(45vh) rotate(180deg) scale(1);
            }

            85% {
                opacity: .55;
            }

            100% {
                transform:
                    translateY(-15vh) rotate(360deg) scale(.7);

                opacity: 0;
            }
        }

        .login-card {
            position: relative;
            z-index: 5;
            width: min(420px, 100%);
            padding: 48px 38px 36px;
            text-align: center;
            border-radius: 34px;
            background:
                linear-gradient(145deg,
                    rgba(255, 255, 255, .17),
                    rgba(255, 255, 255, .055) 45%,
                    rgba(255, 40, 130, .07));
            border: 1px solid rgba(255, 255, 255, .18);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);

            box-shadow:
                0 35px 100px rgba(0, 0, 0, .55),
                0 0 0 1px rgba(255, 100, 170, .05),
                0 0 70px rgba(255, 35, 135, .16),
                inset 0 1px 0 rgba(255, 255, 255, .25),
                inset 0 -1px 0 rgba(255, 50, 140, .08);

            overflow: hidden;

            animation:
                cardIn 1s cubic-bezier(.16, 1, .3, 1);
        }

        .login-card::before {
            content: "";

            position: absolute;
            top: -2px;
            left: 12%;
            width: 76%;
            height: 2px;

            background:
                linear-gradient(90deg,
                    transparent,
                    rgba(255, 125, 185, .9),
                    rgba(255, 255, 255, .9),
                    rgba(255, 125, 185, .9),
                    transparent);

            box-shadow:
                0 0 15px rgba(255, 80, 160, .8),
                0 0 35px rgba(255, 50, 140, .45);

            opacity: .8;
        }

        .login-card::after {
            content: "♡";

            position: absolute;

            top: 15px;
            right: 20px;

            color: rgba(255, 140, 190, .3);

            font-size: 22px;

            text-shadow:
                0 0 12px rgba(255, 80, 160, .5);

            transform: rotate(12deg);
        }

        .login-card .heart-wrapper::before {
            content: "";

            position: absolute;

            width: 150px;
            height: 150px;

            top: -25px;
            left: 50%;

            transform: translateX(-50%);

            background:
                radial-gradient(circle,
                    rgba(255, 65, 150, .2),
                    transparent 68%);

            filter: blur(18px);

            pointer-events: none;
        }

        .login-card form {
            position: relative;
            z-index: 2;

            padding: 20px 18px 17px;

            border-radius: 24px;

            background:
                linear-gradient(145deg,
                    rgba(0, 0, 0, .12),
                    rgba(255, 255, 255, .035));

            border:
                1px solid rgba(255, 255, 255, .09);

            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, .08),

                0 12px 30px rgba(0, 0, 0, .12);
        }

        .login-card .input-box {
            position: relative;
        }

        .login-card input {
            border:
                1px solid rgba(255, 255, 255, .13);

            background:
                rgba(255, 255, 255, .055);

            box-shadow:
                inset 0 2px 10px rgba(0, 0, 0, .12);
        }

        .login-card input:focus {
            border-color:
                rgba(255, 100, 170, .8);

            background:
                rgba(255, 255, 255, .085);

            box-shadow:
                0 0 0 3px rgba(255, 70, 150, .08),

                0 0 25px rgba(255, 40, 140, .2),

                inset 0 2px 10px rgba(0, 0, 0, .08);
        }

        .login-card button {
            margin-top: 3px;

            border-radius: 16px;

            background:
                linear-gradient(135deg,
                    #ff80b5,
                    #ff397f 45%,
                    #d90058);

            box-shadow:
                0 10px 30px rgba(255, 30, 120, .32),

                inset 0 1px 0 rgba(255, 255, 255, .35);
        }

        .login-card button:hover {
            box-shadow:
                0 14px 38px rgba(255, 30, 120, .5),

                0 0 25px rgba(255, 70, 155, .18),

                inset 0 1px 0 rgba(255, 255, 255, .4);
        }

        @keyframes cardIn {
            from {
                opacity: 0;

                transform:
                    translateY(55px) scale(.86) rotateX(8deg);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0) scale(1) rotateX(0);
            }
        }

        .heart-wrapper {
            position: relative;

            width: 100px;
            height: 100px;

            margin: 0 auto 18px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .heart-wrapper::before,
        .heart-wrapper::after {
            content: "";

            position: absolute;

            border-radius: 50%;

            pointer-events: none;
        }

        .heart-wrapper::before {
            width: 82px;
            height: 82px;

            background:
                radial-gradient(circle,
                    rgba(255, 69, 145, .22),
                    transparent 68%);

            filter: blur(12px);

            animation:
                heartGlow 2s ease-in-out infinite;
        }

        .heart-wrapper::after {
            width: 100%;
            height: 100%;

            border:
                1px solid rgba(255, 116, 177, .12);

            transform: scale(.8);

            animation:
                ringPulse 2.2s ease-out infinite;
        }

        @keyframes heartGlow {

            0%,
            100% {
                transform: scale(.85);
                opacity: .55;
            }

            50% {
                transform: scale(1.15);
                opacity: 1;
            }
        }

        @keyframes ringPulse {
            0% {
                transform: scale(.65);
                opacity: .8;
            }

            100% {
                transform: scale(1.2);
                opacity: 0;
            }
        }

        .main-heart {
            position: relative;

            z-index: 2;

            display: block;

            font-size: 70px;

            line-height: 1;

            filter:
                drop-shadow(0 0 10px rgba(255, 62, 143, .95)) drop-shadow(0 0 25px rgba(255, 50, 140, .6));

            animation:
                heartbeat 1.5s ease-in-out infinite;
        }

        @keyframes heartbeat {

            0%,
            100% {
                transform: scale(1);
            }

            15% {
                transform: scale(1.08);
            }

            30% {
                transform: scale(.98);
            }

            45% {
                transform: scale(1.12);
            }

            60% {
                transform: scale(1);
            }
        }

        h1 {
            position: relative;

            color: #fff;

            font-size: 30px;

            font-weight: 700;

            letter-spacing: -.7px;

            margin-bottom: 9px;

            text-shadow:
                0 0 10px rgba(255, 255, 255, .65),

                0 0 25px rgba(255, 75, 155, .55);
        }

        h1::after {
            content: "";

            display: block;

            width: 38px;
            height: 2px;

            margin: 13px auto 0;

            border-radius: 10px;

            background:
                linear-gradient(90deg,
                    transparent,
                    #ff6ca8,
                    transparent);

            box-shadow:
                0 0 10px rgba(255, 88, 158, .7);
        }

        .subtitle {
            color:
                rgba(255, 255, 255, .68);

            font-size: 13px;

            line-height: 1.7;

            margin-top: 13px;

            margin-bottom: 29px;
        }

        .input-box {
            text-align: left;

            margin-bottom: 18px;
        }

        .input-box label {
            display: flex;
            align-items: center;
            gap: 7px;

            margin-bottom: 9px;

            color:
                rgba(255, 255, 255, .88);

            font-size: 12px;

            font-weight: 600;

            letter-spacing: .2px;
        }

        .input-box label::before {
            content: "♡";

            color: #ff76ae;

            font-size: 14px;

            text-shadow:
                0 0 8px rgba(255, 77, 151, .7);
        }

        input {
            width: 100%;

            padding: 15px 17px;

            border:
                1px solid rgba(255, 255, 255, .16);

            border-radius: 17px;

            outline: none;

            background:
                rgba(0, 0, 0, .12);

            color: white;

            font-family: inherit;

            font-size: 14px;

            transition:
                .3s ease;

            box-shadow:
                inset 0 1px 8px rgba(0, 0, 0, .1);
        }

        input::placeholder {
            color:
                rgba(255, 255, 255, .38);
        }

        input:hover {
            border-color:
                rgba(255, 255, 255, .27);
        }

        input:focus {
            border-color:
                rgba(255, 101, 166, .8);

            background:
                rgba(255, 255, 255, .08);

            box-shadow:
                0 0 0 3px rgba(255, 60, 140, .08),

                0 0 25px rgba(255, 45, 140, .18),

                inset 0 1px 8px rgba(0, 0, 0, .08);
        }

        button {
            position: relative;

            width: 100%;

            padding: 15px;

            overflow: hidden;

            border: none;

            border-radius: 18px;

            background:
                linear-gradient(135deg,
                    #ff70aa 0%,
                    #ff327f 45%,
                    #d90059 100%);

            color: white;

            font-family: inherit;

            font-size: 14px;

            font-weight: 700;

            letter-spacing: .1px;

            cursor: pointer;

            box-shadow:
                0 10px 28px rgba(255, 30, 120, .32),

                inset 0 1px 0 rgba(255, 255, 255, .3);

            transition:
                transform .25s ease,
                box-shadow .25s ease,
                filter .25s ease;
        }

        button::before {
            content: "";

            position: absolute;

            top: 0;
            left: -120%;

            width: 70%;
            height: 100%;

            background:
                linear-gradient(90deg,
                    transparent,
                    rgba(255, 255, 255, .28),
                    transparent);

            transform: skewX(-20deg);

            transition:
                left .6s ease;
        }

        button:hover::before {
            left: 150%;
        }

        button:hover {
            transform:
                translateY(-3px);

            filter:
                brightness(1.07);

            box-shadow:
                0 14px 35px rgba(255, 30, 120, .48),

                inset 0 1px 0 rgba(255, 255, 255, .35);
        }

        button:active {
            transform:
                translateY(0) scale(.97);
        }

        .music-note {
            margin-top: 16px;

            color:
                rgba(255, 255, 255, .42);

            font-size: 10px;

            letter-spacing: .25px;
        }

        .error {
            display: none;

            margin-top: 12px;

            padding: 9px 12px;

            border-radius: 10px;

            color:
                #ffc0d7;

            background:
                rgba(255, 70, 140, .08);

            border:
                1px solid rgba(255, 100, 165, .12);

            font-size: 11px;

            animation:
                errorIn .25s ease;
        }

        @keyframes errorIn {
            from {
                opacity: 0;
                transform: translateY(-4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 450px) {

            body {
                padding: 15px;
            }

            .login-card {
                width: 100%;

                padding: 40px 24px 30px;

                border-radius: 30px;
            }

            .heart-wrapper {
                width: 88px;
                height: 88px;

                margin-bottom: 14px;
            }

            .main-heart {
                font-size: 62px;
            }

            h1 {
                font-size: 26px;
            }

            .subtitle {
                font-size: 12px;

                margin-top: 11px;

                margin-bottom: 25px;
            }

            input {
                padding: 14px 15px;
            }

            button {
                padding: 14px;
            }

            .music-note {
                font-size: 9px;
            }
        }

        @media (max-height: 650px) {

            .login-card {
                padding-top: 27px;
                padding-bottom: 25px;
            }

            .heart-wrapper {
                width: 72px;
                height: 72px;

                margin-bottom: 8px;
            }

            .main-heart {
                font-size: 52px;
            }

            h1 {
                font-size: 23px;
            }

            h1::after {
                margin-top: 9px;
            }

            .subtitle {
                margin-top: 8px;
                margin-bottom: 18px;
            }

            .input-box {
                margin-bottom: 13px;
            }

            input {
                padding: 12px 14px;
            }

            button {
                padding: 12px;
            }

            .music-note {
                margin-top: 11px;
            }
        }
    </style>
</head>

<body>

    <span class="heart" style="left:8%; animation-delay:0s;">♥</span>
    <span class="heart" style="left:20%; animation-delay:2s;">♥</span>
    <span class="heart" style="left:35%; animation-delay:4s;">♥</span>
    <span class="heart" style="left:50%; animation-delay:1s;">♥</span>
    <span class="heart" style="left:65%; animation-delay:3s;">♥</span>
    <span class="heart" style="left:80%; animation-delay:5s;">♥</span>
    <span class="heart" style="left:92%; animation-delay:2s;">♥</span>

    <div class="login-card">

        <div class="heart-wrapper">

            <span class="main-heart">
                ❤️
            </span>

        </div>

        <h1>
            Haii kamu 💕
        </h1>

        <div class="subtitle">
            Eitss, masukin nama kamu dulu ❤️
        </div>

        <form id="loginForm">

            <div class="input-box">

                <label for="nama">
                    Nama kamu
                </label>

                <input type="text" id="nama" placeholder="Masukkan nama kamu..." autocomplete="off" maxlength="30">

            </div>

            <button type="submit">
                Masuk ❤️
            </button>

            <div class="music-note">
                ♫ Jangan lupa nyalakan musiknya yaa...
            </div>

            <div class="error" id="error">
                Isi nama kamu dulu yaa 💕
            </div>

        </form>

    </div>

    <script>
        const form =
            document.getElementById(
                "loginForm"
            );

        const namaInput =
            document.getElementById(
                "nama"
            );

        const error =
            document.getElementById(
                "error"
            );

        form.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();

                const nama =
                    namaInput.value.trim();

                if (!nama) {

                    error.style.display =
                        "block";

                    namaInput.focus();

                    return;

                }

                localStorage.setItem(
                    "namaPacar",
                    nama
                );

                localStorage.setItem(
                    "playMusic",
                    "true"
                );

                localStorage.setItem(
                    "musicTime",
                    "0"
                );

                window.location.href =
                    "home.html";

            }
        );
    </script>

</body>

</html>
