<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>for yaya ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;

            font-family: "DM Sans", Arial, sans-serif;

            background:
                radial-gradient(
                    circle at 10% 15%,
                    rgba(255, 60, 145, .25),
                    transparent 27%
                ),
                radial-gradient(
                    circle at 90% 85%,
                    rgba(190, 30, 130, .24),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #16000f 0%,
                    #420027 48%,
                    #190010 100%
                );
        }

        body::before {
            content: "";

            position: absolute;
            inset: 0;

            background-image:
                radial-gradient(
                    circle,
                    rgba(255,255,255,.65) 1px,
                    transparent 1.5px
                );

            background-size: 70px 70px;

            opacity: .1;

            pointer-events: none;
        }

        body::after {
            content: "";

            position: absolute;

            width: 500px;
            height: 500px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255, 35, 132, .12),
                    transparent 68%
                );

            pointer-events: none;
        }

        .heart {
            position: fixed;

            z-index: 1;

            color: #ff6ca8;

            font-size: 18px;

            opacity: 0;

            pointer-events: none;

            text-shadow:
                0 0 8px rgba(255, 79, 151, .65),
                0 0 18px rgba(255, 45, 137, .35);

            animation:
                float 8s linear infinite;
        }

        .heart:nth-of-type(1) {
            font-size: 14px;
        }

        .heart:nth-of-type(2) {
            font-size: 21px;
        }

        .heart:nth-of-type(3) {
            font-size: 16px;
        }

        .heart:nth-of-type(4) {
            font-size: 24px;
        }

        .heart:nth-of-type(5) {
            font-size: 17px;
        }

        .heart:nth-of-type(6) {
            font-size: 20px;
        }

        .heart:nth-of-type(7) {
            font-size: 15px;
        }

        @keyframes float {
            0% {
                transform:
                    translateY(110vh)
                    rotate(0deg)
                    scale(.7);

                opacity: 0;
            }

            15% {
                opacity: .6;
            }

            50% {
                transform:
                    translateY(45vh)
                    rotate(180deg)
                    scale(1);
            }

            85% {
                opacity: .5;
            }

            100% {
                transform:
                    translateY(-15vh)
                    rotate(360deg)
                    scale(.7);

                opacity: 0;
            }
        }

        .login-card {
            position: relative;

            z-index: 5;

            width: min(420px, 100%);

            padding: 46px 38px 34px;

            text-align: center;

            border:
                1px solid
                rgba(255,255,255,.17);

            border-radius: 34px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.14),
                    rgba(255,255,255,.045)
                );

            backdrop-filter:
                blur(12px);

            -webkit-backdrop-filter:
                blur(12px);

            box-shadow:
                0 30px 70px
                rgba(0,0,0,.5),

                inset 0 1px 0
                rgba(255,255,255,.2),

                0 0 45px
                rgba(255,30,130,.12);

            overflow: hidden;

            animation:
                cardIn .8s
                cubic-bezier(.16,1,.3,1);
        }

        .login-card::before {
            content: "";

            position: absolute;

            top: 0;
            left: 12%;

            width: 76%;
            height: 2px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,120,180,.8),
                    rgba(255,255,255,.8),
                    rgba(255,120,180,.8),
                    transparent
                );

            box-shadow:
                0 0 12px
                rgba(255,80,160,.6);

            pointer-events: none;
        }

        .login-card::after {
            content: "♡";

            position: absolute;

            top: 14px;
            right: 18px;

            color:
                rgba(255,140,190,.3);

            font-size: 21px;

            pointer-events: none;
        }

        @keyframes cardIn {
            from {
                opacity: 0;

                transform:
                    translateY(35px)
                    scale(.9);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }

        .heart-wrapper {
            position: relative;

            width: 88px;
            height: 88px;

            margin: 0 auto 16px;

            display: flex;

            align-items: center;

            justify-content: center;
        }

        .heart-wrapper::before {
            content: "";

            position: absolute;

            width: 90px;
            height: 90px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255,60,145,.2),
                    transparent 68%
                );

            pointer-events: none;
        }

        .heart-wrapper::after {
            content: "";

            position: absolute;

            width: 78px;
            height: 78px;

            border-radius: 50%;

            border:
                1px solid
                rgba(255,110,175,.15);

            pointer-events: none;

            animation:
                ringPulse 2.2s ease-out infinite;
        }

        @keyframes ringPulse {
            0% {
                transform: scale(.75);
                opacity: .7;
            }

            100% {
                transform: scale(1.15);
                opacity: 0;
            }
        }

        .main-heart {
            position: relative;

            z-index: 2;

            display: block;

            font-size: 68px;

            line-height: 1;

            filter:
                drop-shadow(
                    0 0 9px
                    rgba(255,62,143,.9)
                )
                drop-shadow(
                    0 0 20px
                    rgba(255,50,140,.45)
                );

            animation:
                heartbeat 1.5s ease-in-out infinite;
        }

        @keyframes heartbeat {
            0%,
            100% {
                transform: scale(1);
            }

            15% {
                transform: scale(1.08);
            }

            30% {
                transform: scale(.98);
            }

            45% {
                transform: scale(1.1);
            }

            60% {
                transform: scale(1);
            }
        }

        h1 {
            color: white;

            font-size: 29px;

            font-weight: 700;

            letter-spacing: -.6px;

            margin-bottom: 8px;

            text-shadow:
                0 0 9px
                rgba(255,255,255,.6),

                0 0 22px
                rgba(255,80,160,.5);
        }

        h1::after {
            content: "";

            display: block;

            width: 36px;
            height: 2px;

            margin: 12px auto 0;

            border-radius: 10px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #ff6ca8,
                    transparent
                );

            box-shadow:
                0 0 8px
                rgba(255,88,158,.6);
        }

        .subtitle {
            color:
                rgba(255,255,255,.66);

            font-size: 13px;

            line-height: 1.7;

            margin-top: 12px;

            margin-bottom: 26px;
        }

        .login-card form {
            position: relative;

            z-index: 2;

            padding: 20px 18px 16px;

            border-radius: 23px;

            background:
                rgba(0,0,0,.1);

            border:
                1px solid
                rgba(255,255,255,.07);

            box-shadow:
                inset 0 1px 0
                rgba(255,255,255,.07);
        }

        .input-box {
            text-align: left;

            margin-bottom: 17px;
        }

        .input-box label {
            display: flex;

            align-items: center;

            gap: 7px;

            margin-bottom: 9px;

            color:
                rgba(255,255,255,.88);

            font-size: 12px;

            font-weight: 600;
        }

        .input-box label::before {
            content: "♡";

            color: #ff76ae;

            font-size: 14px;

            text-shadow:
                0 0 7px
                rgba(255,77,151,.6);
        }

        input {
            width: 100%;

            padding: 14px 16px;

            border:
                1px solid
                rgba(255,255,255,.13);

            border-radius: 16px;

            outline: none;

            background:
                rgba(255,255,255,.05);

            color: white;

            font-family: inherit;

            font-size: 14px;

            transition:
                .25s ease;

            box-shadow:
                inset 0 2px 8px
                rgba(0,0,0,.1);
        }

        input::placeholder {
            color:
                rgba(255,255,255,.36);
        }

        input:hover {
            border-color:
                rgba(255,255,255,.22);
        }

        input:focus {
            border-color:
                rgba(255,100,170,.75);

            background:
                rgba(255,255,255,.075);

            box-shadow:
                0 0 0 3px
                rgba(255,60,140,.07),

                0 0 18px
                rgba(255,45,140,.16);
        }

        button {
            position: relative;

            width: 100%;

            padding: 14px;

            overflow: hidden;

            border: none;

            border-radius: 16px;

            background:
                linear-gradient(
                    135deg,
                    #ff70aa,
                    #ff397f 48%,
                    #d90058
                );

            color: white;

            font-family: inherit;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 9px 25px
                rgba(255,30,120,.3),

                inset 0 1px 0
                rgba(255,255,255,.3);

            transition:
                transform .2s ease,
                box-shadow .2s ease;
        }

        button::before {
            content: "";

            position: absolute;

            top: 0;
            left: -100%;

            width: 60%;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,.25),
                    transparent
                );

            transform: skewX(-20deg);

            transition:
                left .55s ease;
        }

        button:hover::before {
            left: 140%;
        }

        button:hover {
            transform:
                translateY(-2px);

            box-shadow:
                0 12px 30px
                rgba(255,30,120,.42);
        }

        button:active {
            transform:
                scale(.97);
        }

        .music-note {
            margin-top: 15px;

            color:
                rgba(255,255,255,.4);

            font-size: 10px;

            letter-spacing: .2px;
        }

        .error {
            display: none;

            margin-top: 11px;

            padding: 8px 10px;

            border-radius: 9px;

            color:
                #ffc0d7;

            background:
                rgba(255,70,140,.07);

            border:
                1px solid
                rgba(255,100,165,.1);

            font-size: 11px;
        }

        @media (max-width: 450px) {

            body {
                padding: 15px;
            }

            .login-card {
                width: 100%;

                padding: 38px 23px 29px;

                border-radius: 29px;

                backdrop-filter:
                    blur(8px);

                -webkit-backdrop-filter:
                    blur(8px);
            }

            .heart-wrapper {
                width: 78px;
                height: 78px;

                margin-bottom: 13px;
            }

            .main-heart {
                font-size: 60px;
            }

            h1 {
                font-size: 25px;
            }

            .subtitle {
                font-size: 12px;

                margin-top: 10px;

                margin-bottom: 23px;
            }

            .login-card form {
                padding: 18px 15px 15px;

                border-radius: 20px;
            }

            input {
                padding: 13px 14px;
            }

            button {
                padding: 13px;
            }

            .music-note {
                font-size: 9px;
            }
        }

        @media (max-height: 650px) {

            .login-card {
                padding-top: 25px;
                padding-bottom: 23px;
            }

            .heart-wrapper {
                width: 68px;
                height: 68px;

                margin-bottom: 7px;
            }

            .main-heart {
                font-size: 50px;
            }

            h1 {
                font-size: 23px;
            }

            h1::after {
                margin-top: 8px;
            }

            .subtitle {
                margin-top: 7px;
                margin-bottom: 16px;
            }

            .input-box {
                margin-bottom: 12px;
            }

            input {
                padding: 11px 13px;
            }

            button {
                padding: 11px;
            }

            .music-note {
                margin-top: 9px;
            }
        }
    </style>
</head>

<body>

    <span class="heart" style="left:8%; animation-delay:0s;">♥</span>
    <span class="heart" style="left:20%; animation-delay:2s;">♥</span>
    <span class="heart" style="left:35%; animation-delay:4s;">♥</span>
    <span class="heart" style="left:50%; animation-delay:1s;">♥</span>
    <span class="heart" style="left:65%; animation-delay:3s;">♥</span>
    <span class="heart" style="left:80%; animation-delay:5s;">♥</span>
    <span class="heart" style="left:92%; animation-delay:2s;">♥</span>

    <div class="login-card">

        <div class="heart-wrapper">

            <span class="main-heart">
                ❤️
            </span>

        </div>

        <h1>
            Haii kamu 💕
        </h1>

        <div class="subtitle">
            Eitss, masukin nama kamu dulu ❤️
        </div>

        <form id="loginForm">

            <div class="input-box">

                <label for="nama">
                    Nama kamu
                </label>

                <input
                    type="text"
                    id="nama"
                    placeholder="Masukkan nama kamu..."
                    autocomplete="off"
                    maxlength="30"
                >

            </div>

            <button type="submit">
                Masuk ❤️
            </button>

            <div class="music-note">
                ♫ Jangan lupa nyalakan musiknya yaa...
            </div>

            <div
                class="error"
                id="error"
            >
                Isi nama kamu dulu yaa 💕
            </div>

        </form>

    </div>

    <script>
        const form =
            document.getElementById(
                "loginForm"
            );

        const namaInput =
            document.getElementById(
                "nama"
            );

        const error =
            document.getElementById(
                "error"
            );

        form.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();

                const nama =
                    namaInput.value.trim();

                if (!nama) {

                    error.style.display =
                        "block";

                    namaInput.focus();

                    return;

                }

                localStorage.setItem(
                    "namaPacar",
                    nama
                );

                localStorage.setItem(
                    "playMusic",
                    "true"
                );

                localStorage.setItem(
                    "musicTime",
                    "0"
                );

                window.location.href =
                    "home.html";

            }
        );
    </script>

</body>

</html>
